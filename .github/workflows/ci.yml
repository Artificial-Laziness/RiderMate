name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Go Backend CI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'

    - name: Get Dependencies
      run: |
        go mod download

    - name: Go Vet
      run: |
        go vet ./...

    - name: Run Tests
      run: |
        go test -v ./...

    - name: Build Codebase
      run: |
        go build -v ./...

  frontend-ci:
    name: Preact Frontend CI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install Dependencies
      run: |
        cd frontend
        npm ci

    - name: Run Linter
      run: |
        cd frontend
        npm run lint

    - name: Run Tests
      run: |
        cd frontend
        npm run test

    - name: Build Production Bundle
      run: |
        cd frontend
        npm run build
